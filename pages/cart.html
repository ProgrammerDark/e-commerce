<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Your Cart | NATIVE THREADS</title>
		<link rel="stylesheet" href="../css/styles.css" />
	</head>
	<body>
		<header class="site-header">
			<nav class="navbar" aria-label="Main navigation">
				<a class="logo" href="../index.html">NATIVE THREADS</a>
				<ul class="nav-links">
					<li><a href="../index.html">Home</a></li>
					<li><a href="shop.html">Shop</a></li>
					<li><a href="cart.html" aria-current="page">Cart</a></li>
				</ul>
			</nav>
		</header>

		<main class="section narrow-section">
			<header class="page-heading">
				<p class="eyebrow">Almost yours</p>
				<h1>Your cart</h1>
			</header>
			<section class="cart-content" aria-label="Shopping cart">
				<article class="cart-item">
					<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&amp;fit=crop&amp;w=400&amp;q=85" alt="Everyday Linen Shirt" />
					<div>
						<h2>Everyday Linen Shirt</h2>
						<p>Size: Medium</p>
						<p>Quantity: 1</p>
						<a class="text-link" href="shop.html">Remove</a>
					</div>
					<p class="cart-price">$48.00</p>
				</article>
				<div class="cart-total">
					<p><span>Subtotal</span><strong>$48.00</strong></p>
					<p class="small-note">Shipping and taxes are calculated at checkout.</p>
					<a class="button button-full" href="checkout.html">Continue to checkout</a>
					<a class="continue-link" href="shop.html">Continue shopping</a>
				</div>
			</section>
		</main>

		<footer class="site-footer">
			<p>&copy; 2026 NATIVE THREADS. Made for everyday.</p>
		</footer>
	</body>
</html>
